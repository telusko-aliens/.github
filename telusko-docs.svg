<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Telusko Docs - friendly documentation for every tech stack">
  <title>Telusko Docs</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1410"/>
      <stop offset="0.55" stop-color="#0b0f14"/>
      <stop offset="1" stop-color="#07130c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00d632" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#00d632" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="head" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#7dffa3"/>
      <stop offset="1" stop-color="#1fc453"/>
    </radialGradient>
    <linearGradient id="ufoBeam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00d632" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#00d632" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="typeClip">
      <rect x="84" y="332" height="30" width="260">
        <animate attributeName="width" values="0;260;260;0" keyTimes="0;0.35;0.85;1" dur="7s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1d3a28"/>
    </pattern>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace; }
    .sans { font-family: 'Segoe UI','Helvetica Neue',Arial,sans-serif; }
    .float   { animation: float 4s ease-in-out infinite; }
    .blink   { transform-box: fill-box; transform-origin: center; animation: blink 5s infinite; }
    .wave    { transform-box: fill-box; transform-origin: 0% 100%; animation: wave 1.6s ease-in-out infinite; }
    .pulse   { animation: pulse 1.8s ease-in-out infinite; }
    .flip    { transform-box: view-box; transform-origin: 930px 330px; animation: flip 3.5s ease-in-out infinite; }
    .bob1    { animation: bob 3s ease-in-out infinite; }
    .bob2    { animation: bob 3.6s ease-in-out -1.2s infinite; }
    .bob3    { animation: bob 4.2s ease-in-out -2s infinite; }
    .bob4    { animation: bob 3.3s ease-in-out -0.6s infinite; }
    .tw1     { animation: twinkle 2.4s ease-in-out infinite; }
    .tw2     { animation: twinkle 3.1s ease-in-out -1s infinite; }
    .tw3     { animation: twinkle 2.7s ease-in-out -2s infinite; }
    .cursor  { animation: cursor 1s steps(1) infinite; }
    .ufo     { animation: ufo 14s linear infinite; }
    .pill    { animation: pop .5s ease-out both; }
    .p1{animation-delay:.2s}.p2{animation-delay:.35s}.p3{animation-delay:.5s}.p4{animation-delay:.65s}
    .p5{animation-delay:.8s}.p6{animation-delay:.95s}.p7{animation-delay:1.1s}.p8{animation-delay:1.25s}
    .shadow  { transform-box: fill-box; transform-origin: center; animation: shadow 4s ease-in-out infinite; }

    @keyframes float   { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-12px) } }
    @keyframes shadow  { 0%,100% { transform: scaleX(1); opacity: .55 } 50% { transform: scaleX(.8); opacity: .3 } }
    @keyframes blink   { 0%,92%,100% { transform: scaleY(1) } 95% { transform: scaleY(.1) } }
    @keyframes wave    { 0%,100% { transform: rotate(0deg) } 50% { transform: rotate(-28deg) } }
    @keyframes pulse   { 0%,100% { opacity: 1 } 50% { opacity: .35 } }
    @keyframes flip    { 0%,15% { transform: scaleX(1) } 55%,100% { transform: scaleX(-1) } }
    @keyframes bob     { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-10px) } }
    @keyframes twinkle { 0%,100% { opacity: .15 } 50% { opacity: 1 } }
    @keyframes cursor  { 0%,50% { opacity: 1 } 51%,100% { opacity: 0 } }
    @keyframes ufo     { 0% { transform: translateX(-200px) } 100% { transform: translateX(1400px) } }
    @keyframes pop     { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: translateY(0) } }
  </style>

  <!-- background -->
  <rect width="1200" height="420" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="18" fill="url(#dots)" opacity="0.6"/>
  <rect x="1" y="1" width="1198" height="418" rx="18" fill="none" stroke="#00d632" stroke-opacity="0.35"/>

  <!-- corner brackets (matches main banner) -->
  <g stroke="#00d632" stroke-width="2" fill="none" opacity="0.8">
    <path d="M24 60 V24 H60"/><path d="M1140 24 H1176 V60"/>
    <path d="M24 360 V396 H60"/><path d="M1176 360 V396 H1140"/>
  </g>

  <!-- twinkling sparkles -->
  <g fill="#b6ffc9">
    <path class="tw1" d="M640 70 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4z"/>
    <path class="tw2" d="M1110 300 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3z"/>
    <path class="tw3" d="M700 360 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3z"/>
    <circle class="tw2" cx="560" cy="40" r="2"/>
    <circle class="tw1" cx="1150" cy="130" r="2"/>
    <circle class="tw3" cx="760" cy="60" r="1.6"/>
    <circle class="tw1" cx="520" cy="385" r="1.6"/>
  </g>

  <!-- little UFO flying across -->
  <g class="ufo">
    <g transform="translate(0 38)">
      <path d="M-14 12 L-26 44 H26 L14 12 Z" fill="url(#ufoBeam)" opacity="0.6"/>
      <ellipse cx="0" cy="6" rx="12" ry="9" fill="#9fffbf" opacity="0.9"/>
      <ellipse cx="0" cy="12" rx="26" ry="7" fill="#2b3a33" stroke="#00d632" stroke-width="1.5"/>
      <circle class="tw1" cx="-13" cy="12" r="2" fill="#00ff66"/>
      <circle class="tw2" cx="0" cy="14" r="2" fill="#00ff66"/>
      <circle class="tw3" cx="13" cy="12" r="2" fill="#00ff66"/>
    </g>
  </g>

  <!-- ================= LEFT: TEXT ================= -->
  <text x="60" y="92" class="mono" font-size="15" letter-spacing="4" fill="#00d632">// OFFICIAL DOCUMENTATION</text>

  <text x="56" y="168" class="sans" font-size="76" font-weight="900" letter-spacing="3" fill="#ffffff">TELUSKO<tspan fill="#00d632" dx="18">DOCS</tspan></text>

  <text x="60" y="210" class="sans" font-size="20" fill="#9aa7b4">Friendly docs for every tech stack: backend, AI, cloud &amp; beyond.</text>

  <!-- topic pills -->
  <g class="mono" font-size="13" font-weight="700" letter-spacing="1" text-anchor="middle">
    <g class="pill p1"><rect x="60"  y="236" width="59"  height="30" rx="15" fill="#ED8B00"/><text x="89.5"  y="256" fill="#fff">JAVA</text></g>
    <g class="pill p2"><rect x="129" y="236" width="77"  height="30" rx="15" fill="#3776AB"/><text x="167.5" y="256" fill="#fff">PYTHON</text></g>
    <g class="pill p3"><rect x="216" y="236" width="86"  height="30" rx="15" fill="#009688"/><text x="259"   y="256" fill="#fff">FASTAPI</text></g>
    <g class="pill p4"><rect x="312" y="236" width="103" height="30" rx="15" fill="#6DB33F"/><text x="363.5" y="256" fill="#fff">SPRING AI</text></g>
    <g class="pill p5"><rect x="60"  y="276" width="50"  height="30" rx="15" fill="#232F3E" stroke="#FF9900"/><text x="85" y="296" fill="#FF9900">AWS</text></g>
    <g class="pill p6"><rect x="120" y="276" width="42"  height="30" rx="15" fill="#00ADD8"/><text x="141"   y="296" fill="#fff">GO</text></g>
    <g class="pill p7"><rect x="172" y="276" width="138" height="30" rx="15" fill="#6f42c1"/><text x="241"   y="296" fill="#fff">SYSTEM DESIGN</text></g>
    <g class="pill p8"><rect x="320" y="276" width="50"  height="30" rx="15" fill="#F05032"/><text x="345"   y="296" fill="#fff">GIT</text></g>
  </g>

  <!-- terminal line with typing effect -->
  <rect x="60" y="326" width="330" height="42" rx="8" fill="#050807" stroke="#1f3b29"/>
  <circle cx="74" cy="347" r="3" fill="#00d632"/>
  <g clip-path="url(#typeClip)">
    <text x="88" y="353" class="mono" font-size="17" fill="#00d632">$ open <tspan fill="#e6fff0">docs.telusko.com</tspan></text>
  </g>
  <rect class="cursor" x="352" y="336" width="9" height="20" fill="#00d632"/>

  <!-- ================= RIGHT: ALIEN MASCOT ================= -->
  <ellipse cx="930" cy="330" rx="200" ry="120" fill="url(#glow)"/>
  <ellipse class="shadow" cx="930" cy="392" rx="120" ry="10" fill="#00d632" opacity="0.5"/>

  <!-- floating code chips -->
  <g class="mono" font-weight="700" text-anchor="middle">
    <g class="bob1"><rect x="790" y="96" width="64" height="38" rx="10" fill="#0f2418" stroke="#00d632"/><text x="822" y="121" font-size="18" fill="#00d632">&lt;/&gt;</text></g>
    <g class="bob2"><rect x="1070" y="150" width="58" height="38" rx="10" fill="#0f2418" stroke="#00d632"/><text x="1099" y="175" font-size="18" fill="#00d632">{ }</text></g>
    <g class="bob3"><rect x="1040" y="62"  width="50" height="36" rx="18" fill="#00d632"/><text x="1065" y="86" font-size="16" fill="#06210f">AI</text></g>
    <g class="bob4"><rect x="752" y="230" width="44" height="38" rx="10" fill="#0f2418" stroke="#7dffa3" stroke-dasharray="4 3"/><text x="774" y="256" font-size="18" fill="#7dffa3">λ</text></g>
  </g>

  <g class="float">
    <!-- antennas -->
    <g stroke="#1fc453" stroke-width="5" stroke-linecap="round" fill="none">
      <path d="M905 158 Q895 135 882 118"/>
      <path d="M955 158 Q965 135 978 118"/>
    </g>
    <circle class="pulse" cx="880" cy="114" r="9" fill="#00ff66"/>
    <circle class="pulse" cx="980" cy="114" r="9" fill="#00ff66"/>
    <circle cx="877" cy="111" r="3" fill="#eafff0"/>
    <circle cx="977" cy="111" r="3" fill="#eafff0"/>

    <!-- body -->
    <ellipse cx="930" cy="278" rx="40" ry="34" fill="#1fc453"/>
    <ellipse cx="930" cy="286" rx="22" ry="18" fill="#7dffa3" opacity="0.5"/>

    <!-- waving arm -->
    <g class="wave">
      <path d="M962 268 Q985 250 996 222" stroke="#1fc453" stroke-width="12" stroke-linecap="round" fill="none"/>
      <circle cx="997" cy="218" r="10" fill="#3ee26f"/>
    </g>
    <!-- other arm resting on book -->
    <path d="M898 270 Q880 290 885 312" stroke="#1fc453" stroke-width="12" stroke-linecap="round" fill="none"/>

    <!-- head -->
    <ellipse cx="930" cy="200" rx="68" ry="56" fill="url(#head)" stroke="#149c40" stroke-width="3"/>
    <!-- eyes -->
    <g class="blink">
      <ellipse cx="903" cy="198" rx="17" ry="22" fill="#0b0f14"/>
      <ellipse cx="957" cy="198" rx="17" ry="22" fill="#0b0f14"/>
      <circle cx="909" cy="189" r="6" fill="#ffffff"/>
      <circle cx="963" cy="189" r="6" fill="#ffffff"/>
      <circle cx="899" cy="207" r="2.5" fill="#ffffff"/>
      <circle cx="953" cy="207" r="2.5" fill="#ffffff"/>
    </g>
    <!-- cheeks & smile -->
    <ellipse cx="877" cy="222" rx="10" ry="6" fill="#ff7aa8" opacity="0.55"/>
    <ellipse cx="983" cy="222" rx="10" ry="6" fill="#ff7aa8" opacity="0.55"/>
    <path d="M914 230 Q930 246 946 230" stroke="#0b0f14" stroke-width="4" stroke-linecap="round" fill="#0b0f14"/>
    <path d="M922 236 Q930 242 938 236" fill="#ff7aa8"/>

    <!-- open book -->
    <path d="M930 318 Q865 296 790 308 L790 350 Q865 340 930 362 Z" fill="#eafff0" stroke="#00d632" stroke-width="3"/>
    <path d="M930 318 Q995 296 1070 308 L1070 350 Q995 340 930 362 Z" fill="#eafff0" stroke="#00d632" stroke-width="3"/>
    <g stroke="#9bd8ad" stroke-width="3" stroke-linecap="round">
      <path d="M812 318 Q860 310 910 322"/><path d="M812 332 Q860 324 900 334"/>
      <path d="M950 322 Q1000 310 1048 318"/><path d="M960 334 Q1000 324 1048 332"/>
    </g>
    <!-- flipping page -->
    <path class="flip" d="M930 318 Q995 298 1066 310 L1066 348 Q995 338 930 360 Z" fill="#d4ffdf" stroke="#00d632" stroke-width="2" opacity="0.95"/>
    <line x1="930" y1="318" x2="930" y2="362" stroke="#00a826" stroke-width="3"/>
  </g>

  <text x="930" y="412" class="mono" font-size="12" letter-spacing="3" text-anchor="middle" fill="#3f7a52">LEARN · PRACTICE · BUILD</text>
</svg>
