<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 100" width="1200" height="100">
  
  <rect width="1200" height="100" fill="#0d1117"/>
  
  <rect y="0" width="1200" height="10" fill="#0d2b0d" opacity="0.5"/>
  <rect y="10" width="1200" height="10" fill="#0a1f0a" opacity="0.3"/>

  <line x1="0" y1="2" x2="0" y2="2" stroke="#00ff41" stroke-width="1.5" opacity="0">
    <animate attributeName="x2" values="0;1200" dur="1.5s" fill="freeze"/>
    <animate attributeName="opacity" values="0;0.5" dur="0.1s" fill="freeze"/>
  </line>

  <text x="600" y="45" text-anchor="middle" font-family="Courier New, monospace" font-size="15" fill="#00cc33" opacity="0">
    We don't teach, we educate.
    <animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.5s" fill="freeze"/>
  </text>

  <text x="600" y="72" text-anchor="middle" font-family="Courier New, monospace" font-size="12" fill="#444444" opacity="0">
    Stay Curious. Keep Coding.
    <animate attributeName="opacity" values="0;1" dur="0.8s" begin="1s" fill="freeze"/>
  </text>

</svg>
